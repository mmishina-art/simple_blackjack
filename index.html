<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0806" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iPhone のホーム画面アプリ: ステータスバーを不透明（black）にする。透明だと、画面の上端で、
         ステータスバーの下に入った内容を iOS がぼかして、文字が読みにくくなる（simple_chess と同じ対応） -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Shippori+Mincho+B1:wght@500;700;800&display=swap"
    />
    <title>Bust or Die</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- 起動できなかったときの復旧（main.ts が読み込めなくても動く、別のふつうのスクリプト） -->
    <div id="boot-error" class="update-banner boot-error" role="alert" hidden>
      <span>うまく読み込めませんでした<small>（記録は消えません）</small></span>
      <button id="boot-repair" type="button" class="update-banner__btn update-banner__btn--primary">なおす</button>
    </div>

    <script src="boot.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
